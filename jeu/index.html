<title>Trois Voies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout : méta-jeu en écrans plein cadre (QG, deck, collection…) ; bataille = bandeau, carte en vues multiples, panneau de commandement. Univers sombre assumé, un seul thème. */
:root{
  --ink:#090d0c; --bg2:#0e1412; --panel:#131b18; --panel2:#1a2420; --panel3:#212d28; --line:#29372f; --line2:#3a4c42;
  --fg:#f0e9d6; --mut:#97a69a; --gold:#e8b44a; --gold2:#f8d985; --ally:#56c8f0; --foe:#ef5b4c; --leaf:#86d27a; --vio:#b779ec; --cry:#7fd8ff;
  --r0:#b8936a; --r1:#5aa8e8; --r2:#b779ec; --r3:#f2c14e;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.4}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
kbd{font-family:var(--f-body);font-size:10px;font-weight:800;padding:1px 4px;border-radius:3px;border:1px solid var(--line2);background:#0b100e;color:var(--mut);line-height:1.2}
@media (hover:none){kbd.h{display:none}}

/* ---------- écrans méta ---------- */
#menuBg{position:fixed;inset:0;width:100%;height:100%;opacity:.32;pointer-events:none}
.screen{position:fixed;inset:0;overflow:auto;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
.screen::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(232,180,74,.07),transparent 50%),radial-gradient(ellipse at 50% 30%,transparent 0,rgba(9,13,12,.6) 60%,var(--ink) 100%);pointer-events:none}
.wrap{position:relative;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;background:linear-gradient(180deg,rgba(9,13,12,.97),rgba(9,13,12,.85));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#090d0c}
.top h2{font-size:22px;flex:1;min-width:140px}
.back{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:700;font-size:14px}
.back::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:3px}
.curs{display:flex;gap:8px;flex-wrap:wrap}
.cur{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:linear-gradient(180deg,#1a2420,#111916);font-weight:800;font-size:15px}
.cur small{font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.04em}
.crys{width:11px;height:15px;flex:none;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:linear-gradient(160deg,#e6fbff,#7fd8ff 45%,#2a6a9a);filter:drop-shadow(0 0 4px rgba(127,216,255,.7))}
.crys.v{background:linear-gradient(160deg,#fbe6ff,#c58cff 45%,#5a2a9a);filter:drop-shadow(0 0 4px rgba(197,140,255,.75))}
.star{width:14px;height:14px;flex:none;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(180deg,#fff2b0,#e8b44a)}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b0,#e8b44a 50%,#8a5a12);box-shadow:0 0 8px rgba(232,180,74,.6);flex:none}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
.lead{color:var(--mut);max-width:62ch;font-size:15.5px;line-height:1.5}
.hero-t{display:flex;flex-direction:column;gap:8px;padding-top:26px}
#meta{background:linear-gradient(180deg,rgba(8,10,9,.42),rgba(8,10,9,.66)),url(bg-parchment.jpg) center top/cover fixed #120d08}
.logo{display:block;width:min(100%,520px);height:auto;margin:0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.homeban{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line2);min-height:190px;display:grid;place-items:center;padding:18px 12px;background:linear-gradient(180deg,rgba(6,8,7,.15),rgba(6,8,7,.55)),url(bg-home.jpg) center 42%/cover #0c1210;box-shadow:0 14px 30px -14px #000}
.homeban .logo{width:min(92%,440px)}
.start-ban{min-height:260px;margin-bottom:6px}
.bnav img.ni{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));transition:transform .15s}
.bnav button[aria-current="page"] img.ni{transform:scale(1.12)}
.bnav button.plk img.ni{filter:grayscale(.85) brightness(.7)}
.bnav .play .orb.img{background:none;border:0;box-shadow:none;width:70px;height:70px}
.bnav .play .orb.img img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(232,180,74,.55))}
.hero-t h1{font-size:clamp(46px,9vw,92px);line-height:.92;text-shadow:0 3px 0 #000,0 0 50px rgba(232,180,74,.22)}
.hero-t h1 span{color:var(--gold)}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h3{font-size:19px;color:var(--gold2)}
.frame{position:relative;border:1px solid var(--line2);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 34px -22px #000}
.frame.orn::before,.frame.orn::after{content:"";position:absolute;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);top:-4px;opacity:.85}
.frame.orn::before{left:18px}.frame.orn::after{right:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;text-align:left;overflow:hidden;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile canvas{width:100%;height:118px;display:block;background:radial-gradient(ellipse at 50% 100%,rgba(232,180,74,.14),transparent 65%),linear-gradient(180deg,#0f1714,#16201c)}
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile b{font-family:var(--f-display);font-weight:400;font-size:19px}
.tile small{color:var(--mut);font-size:13px;line-height:1.35;flex:1}
.tile .ft{margin-top:8px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--gold2)}
.tile.locked canvas{filter:grayscale(.85) brightness(.55)}
.lockb{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;background:linear-gradient(180deg,#24344a,#162232);border:1px solid #3d5a7a;color:#d6f2ff;font-weight:800;font-size:13px}
.lock{width:12px;height:13px;position:relative;flex:none}
.lock::before{content:"";position:absolute;left:2px;top:0;width:8px;height:7px;border:2px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box}
.lock::after{content:"";position:absolute;left:0;bottom:0;width:12px;height:7px;background:currentColor;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:9px;font-weight:800;font-size:15.5px;background:var(--panel2);border:1px solid var(--line2)}
.btn.main{background:linear-gradient(180deg,#f3c868,#c98f2a);color:#1d1406;border-color:#f6d68a;box-shadow:0 10px 26px -12px rgba(232,180,74,.85),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.blue{background:linear-gradient(180deg,#2c4866,#1a2c42);border-color:#4a7aa6;color:#e0f4ff}
.btn.danger{border-color:#7a3a32;color:#ffb0a6}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;padding:4px;border-radius:10px;background:#0c1210;border:1px solid var(--line)}
.subtabs button{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:7px;font-weight:800;font-size:14px;color:var(--mut)}
.subtabs button[aria-pressed="true"]{background:var(--panel3);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.subtabs button.lk{color:#9fd2f0}
.chip.lk{color:#bfe8ff;border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.muted{color:var(--mut);font-size:13.5px;line-height:1.45}
.lockpanel{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:22px}
.lockpanel h3{font-size:21px}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--mut);background:#0d1311}
.pill.all{color:var(--gold);border-color:#5a4720}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}
.rar{color:var(--rc);border-color:color-mix(in srgb,var(--rc) 45%,transparent)}

.line{padding:14px;display:flex;flex-direction:column;gap:12px;border-color:color-mix(in srgb,var(--rc) 40%,var(--line2))}
.line .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.line .hd h3{font-size:19px;flex:1;min-width:0}
.evo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.evo div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 6px;border-radius:8px;background:#0e1513;border:1px solid var(--line);min-width:0}
.evo div.cur{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,#0e1513);box-shadow:0 0 18px -6px var(--rc)}
.evo div.fut canvas{filter:brightness(0) opacity(.55)}
.evo canvas{width:100%;max-width:64px;aspect-ratio:1;height:auto}
.evo small{font-size:10.5px;line-height:1.15;text-align:center;color:var(--mut);min-height:2.3em;overflow-wrap:anywhere}
.evo div.cur small{color:var(--fg);font-weight:700}
.prog{height:8px;border-radius:5px;background:#0a0f0d;border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#3a7ab0,var(--cry))}
.statrow{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.statrow b{color:var(--fg)}

.tcg{position:relative;width:132px;height:196px;perspective:800px;flex:none;cursor:pointer}
.tcg .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.tcg.open .in{transform:rotateY(180deg)}
.tcg .fa,.tcg .ba{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.tcg .ba{background:repeating-linear-gradient(45deg,#1a2a3a 0 6px,#16222e 6px 12px);border:2px solid #4a7aa6;box-shadow:inset 0 0 0 4px #0d1620}
.tcg .ba::after{content:"";position:absolute;inset:38% 34%;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:linear-gradient(160deg,#e6fbff,#7fd8ff 45%,#2a6a9a)}
.tcg .fa{transform:rotateY(180deg);border:2px solid var(--rc);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 22%,#0e1513),#0e1513 60%);display:flex;flex-direction:column;box-shadow:0 0 24px -6px var(--rc);text-align:left}
.tcg .fa canvas{width:100%;height:112px}
.tcg .fa b{font-family:var(--f-display);font-weight:400;font-size:14px;padding:0 8px;line-height:1.1}
.tcg .fa small{font-size:11px;color:var(--mut);padding:2px 8px}
.tcg .badge{position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:999px;background:var(--rc);color:#120d04;font-weight:800;font-size:12px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pack{position:relative;display:flex;flex-direction:column;overflow:hidden;text-align:left;border-radius:14px;border:1px solid color-mix(in srgb,var(--fc) 55%,#000);background:linear-gradient(160deg,color-mix(in srgb,var(--fc) 40%,#101814),#0d1311 70%);min-height:250px;transition:transform .2s}
.pack:hover{transform:translateY(-3px) rotate(-.6deg)}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(-100%);transition:transform .8s;pointer-events:none}
.pack:hover::after{transform:translateX(100%)}
.pack canvas{width:100%;height:150px}
.pack .pb{padding:10px 14px 14px;display:flex;flex-direction:column;gap:4px}
.pack b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--fc)}
.pack.locked canvas{filter:grayscale(.9) brightness(.5)}

.trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tree{padding:16px;display:flex;flex-direction:column;gap:10px}
.tree h3{font-size:20px;color:var(--tc)}
.node{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);position:relative}
.node+.node::before{content:"";position:absolute;left:22px;top:-11px;height:10px;width:2px;background:var(--line2)}
.node b{font-size:15px}.node small{grid-column:1;color:var(--mut);font-size:13px}
.node .c{grid-row:1/3;grid-column:2;align-self:center;font-weight:800;font-size:13px;color:var(--gold)}
.node.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,var(--panel2))}.node.on .c{color:var(--tc)}

.tiers-wrap{overflow-x:auto}
.tiers{display:grid;grid-template-columns:repeat(6,minmax(86px,1fr));gap:6px}
.tiers div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 3px 8px;border-radius:9px;background:#0e1513;border:1px solid var(--line)}
.tiers div.cur{border-color:var(--gold);box-shadow:0 0 18px -6px var(--gold)}
.tiers div.fut canvas{filter:grayscale(1) brightness(.45)}
.tiers canvas{width:100%;height:100px}
.tiers small{font-size:11px;text-align:center;color:var(--mut);line-height:1.2}
.tiers div.cur small{color:var(--fg);font-weight:700}

#modal,#opening{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(4,7,6,.8);backdrop-filter:blur(4px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal .frame{max-width:420px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px}
#modal h3{font-size:22px}
#opening .wrap{align-items:center;text-align:center;gap:18px;max-height:100%;overflow:auto;padding-block:20px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:10px 16px;border-radius:9px;background:#1d2a25;border:1px solid var(--line2);font-weight:700;box-shadow:0 10px 30px -10px #000;max-width:calc(100% - 32px);text-align:center}

/* ---------- écran principal ---------- */
.hubtop{gap:10px 14px}
.gtabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;padding:3px;border-radius:11px;background:#0c1210;border:1px solid var(--line)}
.gtabs button{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:7px 14px;border-radius:8px;white-space:nowrap;text-align:left}
.gtabs button b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1}
.gtabs button small{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.gtabs button[aria-selected="true"]{background:linear-gradient(180deg,#2a3a32,#1a2420);box-shadow:inset 0 0 0 1px var(--gold);}
.gtabs button[aria-selected="true"] b{color:var(--gold2)}
.gtabs button:disabled{opacity:.55}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh h3{font-size:20px;color:var(--gold2)}
.wcar-wrap{position:relative;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.wcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:thin}
.wcard{position:relative;flex:0 0 min(78%,260px);scroll-snap-align:center;display:flex;flex-direction:column;text-align:left;overflow:hidden;border-radius:14px;border:1px solid var(--line2);background:var(--panel);transition:transform .2s,border-color .2s,box-shadow .2s}
.wcard[aria-pressed="true"]{border-color:var(--wc);box-shadow:0 0 0 1px var(--wc),0 16px 34px -14px var(--wc);transform:translateY(-2px)}
.wcard canvas{width:100%;height:150px;display:block}
.wcard .wb{padding:10px 13px 13px;display:flex;flex-direction:column;gap:5px}
.wcard .wn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--wc)}
.wcard b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.wcard.locked canvas{filter:grayscale(.9) brightness(.4)}
.wcard .lk{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(9,13,12,.85);border:1px solid var(--line2);font-size:11.5px;font-weight:800;color:#bfe8ff}
.medals{display:flex;gap:4px;flex-wrap:wrap}
.medals span{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--mut);background:#0d1311}
.medals span.on{color:#1a1206;background:var(--gold);border-color:var(--gold)}
.medals span.dz.on{background:var(--vio);border-color:var(--vio);color:#fff}
.carbtn{position:absolute;top:62px;width:38px;height:38px;border-radius:50%;background:rgba(9,13,12,.85);border:1px solid var(--line2);font-size:20px;font-weight:800;z-index:2}
.carbtn.l{left:max(6px,env(safe-area-inset-left,0px))}.carbtn.r{right:max(6px,env(safe-area-inset-right,0px))}
@media (hover:none){.carbtn{display:none}}
.wpanel{padding:14px;display:flex;flex-direction:column;gap:12px}
.diffs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.diffs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);text-align:left;min-width:0}
.diffs button b{font-size:15px}
.diffs button small{font-size:11.5px;color:var(--mut);line-height:1.25}
.diffs button .ok{font-size:10.5px;font-weight:800;color:var(--gold)}
.diffs button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel2))}
.diffs button.dz[aria-pressed="true"]{border-color:var(--vio);background:color-mix(in srgb,var(--vio) 16%,var(--panel2))}
@media (max-width:520px){.diffs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chlist{display:flex;flex-direction:column;gap:6px}
.chlist button{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;border:1px solid var(--line2);background:#111815;text-align:left;font-weight:700;font-size:14px}
.chlist button[aria-pressed="true"]{border-color:var(--vio);box-shadow:inset 0 0 0 1px var(--vio)}
.chlist .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.chlist .ck.on{background:var(--vio);border-color:var(--vio)}
.chlist small{margin-left:auto;color:var(--mut);font-weight:700;font-size:12px;white-space:nowrap}
.facs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

function recruitHero(team,hid,lane){
  const T=G.teams[team],hd=T.heroDeck.find(h=>h.id===hid),d=HEROES[hid];
  if(chBlock(team,'nohero','les héros sont interdits'))return false;
  if(!hd||T.heroes.length>=maxHeroes(T)||T.heroes.some(h=>h.def===d))return false;
  if(!spend(T,heroCost(T)))return false;
  createHero(team,hd,lane);
  log(team===0?`${d.name} rejoint la bataille`:`Adversaire : le héros ${d.name} entre en jeu`,team===0?'a':'f');return true;
}
function createHero(team,hd,lane){
  const T=G.teams[team],d=HEROES[hd.id],f=FOUNT[team];const h=makeUnit(team,{...d,look:LOOKS[d.look],tags:{}},lane,f.x+rnd(-6,6),f.y+rnd(-6,6),'hero');h.def=d;
  Object.assign(h,{mode:'push',prevMode:'push',lvl:T.has('h4')?3:1,metaLvl:hd.lvl||1,relic:hd.relic,rlv:hd.rlv||1,xl:hd.xl||1,xp:0,inv:[],soinCd:0,respawnT:0,name:d.name,maxHp:0,aiSkT:1,
    skl:[...d.sk,...(hd.xs||[]).map((ty,n)=>mkSkill(ty,d.fac,4+n))]});
  h.sk=h.skl.map((s,i)=>({cl:i===3?15:1.5+i,rk:i<4?clamp((hd.sk&&hd.sk[i])||1,1,SK_MAX):clamp(1+Math.floor((hd.xl||1)/10),1,SK_MAX)}));
  heroCalc(h);h.hp=h.maxHp;T.heroes.push(h);fxRing(h.x,h.y,30,FACTIONS[T.faction].acc);return h;
}
function heroCalc(h){
  const T=G.teams[h.team],d=h.def,m=(1+.09*(h.lvl-1))*(1+.1*(h.metaLvl-1))*(1+.04*((h.xl||1)-1))*(T.has('vh5')?1.2:1);
  let atk=d.atk,hp=d.hp,arm=d.armor,as=0,spd=0,regen=2,range=d.range,hpPct=0;const tags={...(d.pas.tags||{})};
  const add=(st,tg,k=1)=>{if(st){atk+=(st.atk||0)*k;hp+=(st.hp||0)*k;arm+=(st.armor||0)*k;as+=(st.as||0)*k;spd+=st.spd||0;regen+=(st.regen||0)*k;range+=(st.range||0)*k;hpPct+=(st.hpPct||0)*k}if(tg)for(const x in tg)tags[x]=Math.max(tags[x]||0,tg[x])};
  for(const id of h.inv){const it=COMP[id]||FULL[id];add(it.st,it.tags)}
  if(h.books){const bk=h.books;add({atk:8*(bk.f||0),hp:100*(bk.v||0),armor:5*(bk.a||0),as:.06*(bk.c||0)})}
  if(h.relic&&RELICS[h.relic])add(RELICS[h.relic].st,RELICS[h.relic].tags,relicMul(h.rlv||1));
  add(d.pas.st);regen+=d.pas.regen||0;
  const r=h.maxHp?h.hp/h.maxHp:1;h.maxHp=hp*(1+hpPct)*m*(T.has('h1')?1.15:1);h.hp=r*h.maxHp;
  h.atkV=atk*m;h.armV=arm*(1+.03*(h.lvl-1));h.asV=1+as;h.spdV=1+spd;h.regenV=regen;h.range=range;h.tags=tags;h.egide=h.inv.includes('egide');
}
const compPrice=(T,id)=>Math.round(COMP[id].cost*itemMul(T));
function fullPlan(h,id){const T=G.teams[h.team],inv=[...h.inv],used=[];let missing=0;
  for(const c of FULL[id].from){const i=inv.indexOf(c);if(i>=0){used.push(c);inv.splice(i,1)}else missing+=compPrice(T,c)}
  return{price:Math.round(FULL[id].cost*itemMul(T))+missing,used,slotsAfter:inv.length+1}}
function buyComp(h,id){const T=G.teams[h.team];if(h.inv.length>=6||!spend(T,compPrice(T,id)))return false;h.inv.push(id);heroCalc(h);return true}
function buyFull(h,id){const T=G.teams[h.team],pl=fullPlan(h,id);if(h.inv.includes(id)||pl.slotsAfter>6||!spend(T,pl.price))return false;for(const u of pl.used)h.inv.splice(h.inv.indexOf(u),1);h.inv.push(id);heroCalc(h);if(!h.dead)fxRing(h.x,h.y,24,'#ffd27a');return true}
function sellItem(h,i){const T=G.teams[h.team],id=h.inv[i];if(!id)return;const v=COMP[id]?compPrice(T,id):Math.round((FULL[id].cost+FULL[id].from.reduce((s,c)=>s+COMP[c].cost,0))*itemMul(T));T.gold+=Math.round(v*.6);h.inv.splice(i,1);heroCalc(h)}
function order(h,mode){if(h.dead)return;if(mode==='recall'&&h.mode!=='recall')h.prevMode=h.mode;h.mode=mode;h.target=null}
function heroHeal(h){const T=G.teams[h.team];if(h.dead||h.soinCd>0||!spend(T,50))return false;h.soinCd=12;h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.45);
  for(const u of G.units)if(u.team===h.team&&u!==h&&dist(u,h)<120)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.2);fxRing(h.x,h.y,120,'#86d27a');return true}
function revive(h){const T=G.teams[h.team];if(!h.dead||!spend(T,reviveCost(h)))return false;h.respawnT=0;return true}
function respawnHero(h){const f=FOUNT[h.team];h.dead=false;h.x=f.x;h.y=f.y;h.hp=h.maxHp;h.poisonT=0;h.slowT=0;h.target=null;if(h.mode==='recall')h.mode=h.prevMode||'push';G.units.push(h);fxRing(h.x,h.y,30,'#ffffff')}

/* =========================================================
   COMBAT
   ========================================================= */
function canHit(u,t){if(t.dead)return false;if(t.flying&&u.range<40&&!u.flying&&!u.isStruct)return false;return true}
const enemiesOf=u=>u.team===2?[0,1]:[1-u.team];
function dealDamage(t,amt,src){
  if(t.dead)return;let a=amt;
  if(t.isStruct&&t.type==='nexus'&&t.team===1&&chIs('bast3')&&G.structs.some(s=>s.team===1&&s.type==='bastion'&&!s.dead))return;
  if(t.isStruct){a*=(src&&src.tags&&src.tags.siege)||1;a*=100/200;if(G.mode==='champ'&&G.t>720)a*=1.6}else a*=100/(100+armorOf(t));
  if(t.shield>0){const ab=Math.min(t.shield,a);t.shield-=ab;a-=ab}
  t.hp-=a;t.hitFlash=.12;
  if(src&&!t.isStruct){const tg=src.tags||{};
    if(tg.poison){t.poisonT=4;t.poisonD=tg.poison;t.poisonTeam=src.team}
    if(tg.slow){t.slowF=t.slowT>0?Math.max(t.slowF,tg.slow):tg.slow;t.slowT=2}
    if(tg.lifesteal&&!src.dead&&src.hp>0)src.hp=Math.min(src.maxHp,src.hp+a*tg.lifesteal);
    if(t.tags&&t.tags.thorns&&src.kind&&!src.isStruct&&!src.dead&&src.range<40&&src.hp>0){src.hp-=a*t.tags.thorns;if(src.hp<=0)kill(src,t)}}
  if(t.kind==='neutral'&&src&&src.kind)t.aggroOn=src;
  if(t.hp<=0)kill(t,src);
}
function kill(t,src){
  if(t.dead)return;
  if(t.isStruct){
    t.dead=true;t.hp=0;if(t.team===1){if(t.type==='tower')G.st.towers++;if(t.type==='bastion')G.st.bastions++}const kt=1-t.team,bonus=t.type==='bastion'?300:t.type==='tower'?220:0;G.teams[kt].gold+=bonus;G.teams[kt].towers++;
    fxBoom(t.x,t.y,t.team===0?'#56c8f0':'#ef5b4c',t.type==='nexus'?60:30);
    if(t.portal){siegePortalDown(t);fxBoom(t.x,t.y,'#c08cff',70);return}
    if(t.type==='nexus'){endGame(kt===0);return}
    if(t.team===0&&t.type==='tower'&&chIs('notower')){endGame(false,false,'Défi échoué : une de tes tours est tombée.');return}
    const what=t.type==='bastion'?'bastion':'tour';
    log(t.team===1?`${what==='bastion'?'Bastion':'Tour'} ennemi détruit · ${LANE_NAMES[t.lane]} · +${bonus} or`:`Ta ${what==='bastion'?'bastion':'tour'} est tombé${what==='tour'?'e':''} · ${LANE_NAMES[t.lane]}${t.type==='bastion'?' : plus d’invocations sur cette voie':''}`,t.team===1?'g':'f');
    if(kt===0)floatTxt(t.x,t.y,60,'+'+bonus,'#e8b44a');return;
  }
  if(t.tags.reassemble&&!t.revived){t.revived=true;t.hp=t.maxHp*.5;fxPuff(t.x,t.y,'#e8e2cf',10);return}
  t.dead=true;
  if(t.sgBoss&&G.siege){if(t.sgBoss==='final'){G.teams[0].gold+=t.reward||0;endGame(true,false,'Le Seigneur de guerre est tombé : la citadelle est sauvée !');return}log('Le Champion des ténèbres est vaincu !','v')}
  const kt=src?src.team:(t.poisonTeam>=0?t.poisonTeam:-1);
  fxPuff(t.x,t.y,t.look.col||t.look.body||t.look.bark||'#aaaaaa',12);
  if(t.tags.explode){for(const o of G.units)if(!o.dead&&o.team!==t.team&&o.team!==2&&dist(o,t)<60)dealDamage(o,t.tags.explode,{team:t.team,tags:{}});fxRing(t.x,t.y,60,'#ffb060')}
  if(t.tags.split&&!t.isSplit&&t.lane!=null){for(let i=0;i<2;i++){const d={...t.def,hp:t.def.hp*.35,atk:t.def.atk*.5,scale:(t.def.scale||1)*.7,tags:{...t.tags,split:0}};const s=makeUnit(t.team,d,t.lane,t.x+rnd(-8,8),t.y+rnd(-8,8),'summon');s.isSplit=true}}
  if((kt===0||kt===1)&&kt!==t.team){
    const T=G.teams[kt];let rew=t.kind==='hero'?150+20*t.lvl:t.reward;rew=Math.round(rew*(T.has('e3')?1.15:1));
    T.gold+=rew;T.earned+=rew;T.kills++;if(kt===0&&t.team===1){if(t.kind==='hero')G.st.heroes++;else G.st.minions++}if(kt===0)floatTxt(t.x,t.y,20,'+'+rew,'#e8b44a');
    for(const h of T.heroes)if(!h.dead&&dist(h,t)<190)gainXp(h,rew*1.1);
    if(t.kind==='neutral'&&t.boss)bossReward(kt,t);
  }
  if(t.kind==='hero'){const T=G.teams[t.team];t.cmdT=null;t.movePt=null;t.shield=0;t.stunT=0;t.respawnT=(8+2*t.lvl)*(T.has('h2')?.65:1)*(T.has('vh6')?.5:1);
    log(t.team===0?`${t.name} est tombé · retour dans ${Math.ceil(t.respawnT)} s`:`Héros ennemi abattu : ${t.name}`,t.team===0?'f':'g')}
}
function bossReward(team,t){
  const T=G.teams[team];if(team===0)G.st.boss++;
  if(t.def===NEUTRAL.dragon){T.buffT=60;log(team===0?'Wyrm vaincu : +20 % de dégâts pour toute ton armée (60 s)':'L’adversaire a tué le Wyrm : +20 % de dégâts pour son armée',team===0?'g':'f')}
  else{for(const s of G.structs)if(s.team===team&&!s.dead)s.hp=Math.min(s.maxHp,s.hp+s.maxHp*.3);log(team===0?'Colosse vaincu : tes structures sont réparées de 30 %':'L’adversaire a tué le Colosse et répare ses structures',team===0?'g':'f')}
}
function gainXp(h,x){if(h.lvl>=12)return;h.xp+=x*(G.teams[h.team].has('vh5')?1.3:1);while(h.lvl<12&&h.xp>=120*h.lvl){h.xp-=120*h.lvl;h.lvl++;heroCalc(h);h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.2);fxRing(h.x,h.y,26,'#ffe28a');if(h.team===0)floatTxt(h.x,h.y,40,'Niveau '+h.lvl,'#ffe28a')}}
function face(u,x,y){const dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy)||1;u.fvx=dx/d;u.fvy=dy/d}
function bodyH(o){return o.isStruct?(o.topH||40)*.7:lookHeight(o.look)*(o.scale||1)*.55+(o.flying?10:0)}
function attack(u,t){
  u.cd=cdOf(u);u.atkT=.3;if(!u.isStruct)face(u,t.x,t.y);
  const dmg=atkOf(u);
  if(u.proj||u.range>40){
    const T=G.teams[u.team];const col=u.isStruct?(u.team===0?'#8fe4ff':'#ff8a7a'):u.look&&u.look.glow?u.look.glow:(T?FACTIONS[T.faction].acc:'#ffffff');
    const kind=u.isStruct?'bolt':(u.proj||(u.kind==='minion'?FACTIONS[T.faction].proj:'orb'));
    const aoe=u.isStruct?((u.lvl>=3||T.has('d3'))?40:0):(u.tags.aoe||0);
    G.projs.push({x:u.x,y:u.y,h:u.isStruct?u.topH||40:bodyH(u)+4,t,dmg,src:u,kind,col,spd:u.isStruct?330:260,aoe});
  }else{dealDamage(t,dmg,u);fxSpark(t.x,t.y,10);
    if(u.tags.cleave)for(const o of G.units)if(o!==t&&!o.dead&&o.team===1-u.team&&dist(o,t)<35)dealDamage(o,dmg*u.tags.cleave,u)}
}
const heal=(u,v)=>{u.hp=Math.min(u.maxHp,u.hp+v)};
function findTarget(u,rad,opts={}){
  let best=null,bd=1e9;const foes=enemiesOf(u);
  for(const o of G.units){if(o.dead||!foes.includes(o.team))continue;if(o.team===2&&!opts.neutral)continue;if(opts.not&&o===opts.not)continue;if(!canHit(u,o))continue;const d=dist(u,o)-o.r;if(d<rad&&d<bd){bd=d;best=o}}
  if(u.team!==2&&!opts.noStruct)for(const s of G.structs){if(s.dead||s.team===u.team)continue;const d=dist(u,s)-s.r;if(d<rad&&d<bd-8){bd=d;best=s}}
  return best;
}
function moveTo(u,x,y,dt){const dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy);if(d<1){u.moving=false;return true}const s=Math.min(d,speedOf(u)*dt);u.x+=dx/d*s;u.y+=dy/d*s;if(G.arena&&u.kind==='hero'){if(u.team===0&&u.y<560)u.y=560;else if(u.team===1&&u.y>440)u.y=440}
  {const w=u.x+u.y-1000;if(!G.arena&&!G.siege&&Math.abs(w)>SQ_LIM){const e=(Math.abs(w)-SQ_LIM)*Math.sign(w)/2;u.x-=e;u.y-=e}}u.fvx=dx/d;u.fvy=dy/d;u.moving=true;u.ph+=dt*speedOf(u)*.2;return d<4}
function walkLane(u,tf,dt){const p=PATHS[u.team][u.lane],pr=project(p,u);
  if(pr.d>34){moveTo(u,pr.x,pr.y,dt);return false}if(Math.abs(pr.f-tf)*p.len<10){u.moving=false;return true}
  const st=Math.sign(tf-pr.f)*Math.min(.045,Math.abs(tf-pr.f));const q=pointAt(p,pr.f+st);moveTo(u,q.x,q.y,dt);return false}
function engage(u,t,dt){const d=dist(u,t)-t.r-u.r;if(d>u.range){moveTo(u,t.x,t.y,dt);return}u.moving=false;face(u,t.x,t.y);if(u.cd<=0)attack(u,t)}

/* ---------- héros : tactique ---------- */
function laneFront(team,lane){let f=TOWER_F[0]-.02;for(const u of G.units)if(u.team===team&&u.lane===lane&&u.kind!=='hero'&&!u.dead){const pr=project(PATHS[team][lane],u);if(pr.d<60&&pr.f>f)f=pr.f}return f}
function defendF(team,lane){for(let i=0;i<2;i++){const s=G.structs.find(s=>s.team===team&&s.lane===lane&&s.type==='tower'&&s.tier===i&&!s.dead);if(s)return TOWER_F[i]+.02}return BAST_F+.03}
function pickCamp(h){let best=null,bd=1e9;for(const c of G.camps){if(!c.alive)continue;if(c.boss&&h.lvl<5)continue;const d=dist(h,c)+(c.side===h.team?0:200);if(d<bd){bd=d;best=c}}return best}
function heroThink(h,dt){
  for(const s of h.sk)s.cl-=dt;h.soinCd-=dt;heal(h,h.regenV*dt);
  if(h.mode==='recall'){const f=FOUNT[h.team];h.target=null;
    if(dist(h,f)<40){h.moving=false;heal(h,h.maxHp*.12*dt);if(h.hp>=h.maxHp-1)h.mode=h.prevMode||'push'}
    else if(G.arena||G.siege)moveTo(h,f.x,f.y,dt);else{const pr=project(PATHS[h.team][h.lane],h);if(pr.f>.08&&pr.d<60)walkLane(h,.04,dt);else moveTo(h,f.x,f.y,dt)}return}
  if(h.manual&&h.mode==='manual'){manualThink(h,dt);return}
  h.retarget-=dt;
  if(h.retarget<=0||!h.target||h.target.dead){h.retarget=.3;
    if(h.mode==='jungle'){const camp=pickCamp(h);if(camp){const ns=camp.members.filter(m=>!m.dead);h.target=null;if(dist(h,camp)<110&&ns.length)h.target=ns.reduce((a,b)=>dist(h,a)<dist(h,b)?a:b);
        const near=findTarget(h,90,{noStruct:true});if(near&&near.team!==2)h.target=near;h.jCamp=camp}else{h.jCamp=null;h.target=findTarget(h,120)}}
    else if(h.mode==='roam')h.target=huntTarget(h,380)||findTarget(h,115);
    else h.target=findTarget(h,h.mode==='defend'?150:115);
    if(h.hunt){const w=huntTarget(h,230);if(w)h.target=w}}
  if(h.mode==='defend'&&h.target){const a=pointAt(PATHS[h.team][h.lane],defendF(h.team,h.lane));if(dist(h.target,a)>190)h.target=null}
  if(h.target&&!h.target.dead){autoSkills(h,dt);engage(h,h.target,dt);return}
  if(h.mode==='jungle'&&h.jCamp){moveTo(h,h.jCamp.x,h.jCamp.y+20,dt);return}
  if(h.mode==='roam'){const c=pickCamp(h);if(c&&dist(h,c)>40)moveTo(h,c.x,c.y+20,dt);else{const e=G.teams[1-h.team].heroes.find(x=>!x.dead);moveTo(h,e?lerp(500,e.x,.5):500,e?lerp(500,e.y,.5):500,dt)}return}
  if(h.mode==='push'){walkLane(h,G.siege?.97:Math.min(.97,laneFront(h.team,h.lane)+.015),dt);return}
  walkLane(h,defendF(h.team,h.lane),dt);
}
function huntTarget(h,rad){let b=null;for(const o of G.teams[1-h.team].heroes){if(o.dead||dist(o,h)>rad)continue;if(!b||o.hp<b.hp)b=o}return b}
function nearestLane(team,p){let best=1,bd=1e9;for(let l=0;l<3;l++){const d=project(PATHS[team][l],p).d;if(d<bd){bd=d;best=l}}return best}
function manualThink(h,dt){
  if(h===G.me&&JOY){const v=joyDir();h.cmdT=null;h.movePt=null;h.target=null;moveTo(h,clamp(h.x+v.x*40,15,985),clamp(h.y+v.y*40,15,985),dt);return}
  h.laneT=(h.laneT||0)-dt;if(h.laneT<=0){h.laneT=1;h.lane=nearestLane(h.team,h)}
  if(h.cmdT&&h.cmdT.dead)h.cmdT=null;
  if(h.cmdT){h.target=h.cmdT;engage(h,h.cmdT,dt);return}
  if(h.movePt){if(moveTo(h,h.movePt.x,h.movePt.y,dt))h.movePt=null;return}
  h.retarget-=dt;if(h.retarget<=0||!h.target||h.target.dead){h.retarget=.3;h.target=findTarget(h,h.range+50)}
  if(h.target&&!h.target.dead&&dist(h,h.target)-h.target.r-h.r<=h.range+50){engage(h,h.target,dt);return}
  h.moving=false;
}
/* ---------- compétences des héros ---------- */
const reachOf=(h,S)=>({dash:190,aoe:Math.max(170,h.range+50),aoeU:Math.max(190,h.range+60),stun:Math.max(130,h.range+30)})[S.type]??(h.range+(S.type.startsWith('volley')?40:30));
function foesNear(h,x,y,rad,neu){return G.units.filter(o=>!o.dead&&enemiesOf(h).includes(o.team)&&(neu||o.team!==2)&&Math.hypot(o.x-x,o.y-y)<rad+o.r)}
const alliesNear=(h,rad)=>G.units.filter(o=>!o.dead&&o.team===h.team&&dist(o,h)<rad);
function stunU(o,d){if(!o||o.isStruct||o.dead)return;o.stunT=Math.max(o.stunT||0,o.boss?d*.5:d)}
function shieldU(o,v,d){o.shield=Math.max(o.shield||0,v);o.shieldT=Math.max(o.shieldT||0,d)}
function skTarget(h,S,man){const reach=reachOf(h,S),foes=enemiesOf(h);
  const c=[h.cmdT,h.target].find(o=>o&&!o.dead&&!o.isStruct&&foes.includes(o.team));
  if(c&&dist(h,c)-c.r-h.r<=reach)return c;
  return findTarget(h,reach,{noStruct:true,neutral:man||h.mode==='jungle'})}
function useSkill(h,i,man){
  const S=h.skl[i],st=h.sk&&h.sk[i];if(!S||!st||h.dead||st.cl>0||h.lvl<S.unl||h.stunT>0)return false;
  const rs=1+.22*(st.rk-1),A=atkOf(h),acc=FACTIONS[G.teams[h.team].faction].acc,neu=man||h.mode==='jungle';
  let t=null;if(S.tgt==='foe'){t=skTarget(h,S,man);if(!t){if(man&&h.team===0)toast('Aucune cible à portée');return false}face(h,t.x,t.y)}
  switch(S.type){

    let best=null;for(const l of alive){const g={};for(const e of T.bast[l].roster){if(e.skills.length)continue;const k=e.line+'|'+e.form+'|'+e.star;g[k]=(g[k]||0)+1}

    if(best&&addCost(T,best.l,T.deck[best.di])<=T.gold-reserve){addToBastion(1,best.di,best.l);return}
    const di=Math.floor(Math.random()*T.deck.length),e=T.deck[di];if(!e)return;const l=pick(alive);
    const c=LINES[e.line].scope==='all'?addCostAll(T,e):addCost(T,l,e);if(c!=null&&c<=T.gold-reserve)addToBastion(1,di,l);
  }else if(r<.72){const st=pick(BSTATS).id;const ac=upAllCost(T,st);if(ac&&T.gold-ac>reserve&&Math.random()<.55){upgrade(1,st,'all');return}const l=Math.floor(Math.random()*3);const c=upCost(T,l,st);if(c&&T.gold-c>reserve)upgrade(1,st,l)}
  else if(r<.82){const ts=G.structs.filter(s=>s.team===1&&s.type==='tower'&&!s.dead&&s.lvl<5);if(ts.length){const t=pick(ts);if(T.gold-towerCost(t)>reserve)towerUp(1,t)}}
  else if(r<.9){if(alive.length){const l=pick(alive);if(press[l]<0)fury(1,l);else if(G.structs.some(s=>s.team===1&&!s.dead&&s.hp<s.maxHp*.6))repair(1)}}
  else if(r<.95){const l=Math.floor(Math.random()*3);const c=reinfCost(T,l);if(c&&T.gold-c>reserve)reinforce(1,l)}
  else if(r<.985&&alive.length){const l=pick(alive),R=T.bast[l].roster;if(R.length){const i=Math.floor(Math.random()*R.length),c=evoCost(T,R[i]);if(c&&T.gold-c>reserve)evolveEntry(1,l,i)}}
  else if(G.diff!=='easy'&&alive.length&&T.gold-chaosCost(T)>reserve)chaosSummon(1,pick(alive));
}

  cam.x=hw*2>=VIEW.bx1-VIEW.bx0?cx:clamp(cam.x,VIEW.bx0+hw,VIEW.bx1-hw);cam.y=hh*2>=VIEW.by1-VIEW.by0?cy:clamp(cam.y,VIEW.by0+hh,VIEW.by1-hh)}

    else if(pr.kind==='rock'){c.globalCompositeOperation='source-over';c.fillStyle='#8a7a66';C(c,p.x,p.y,2.4);c.fill();c.globalCompositeOperation='lighter'}
    else{const r=pr.kind==='bolt'?5:pr.kind==='shell'?3.5:2.8;const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.4);g.addColorStop(0,'#ffffff');g.addColorStop(.35,pr.col);g.addColorStop(1,hexA(pr.col,0));c.fillStyle=g;C(c,p.x,p.y,r*2.4);c.fill()}}

function drawUnit(c,u,p,t){

function drawStruct(c,s,p,t){

function drawBars(c,o,p){

function bastRelics(l){
  if(!voieHas('vp1'))return`<div class="lbl"><span class="lock"></span> Reliques de bastion</div><p class="muted">Voie du peuple › Reliquaires : pose une relique sur ce bastion, ses unités en reçoivent une partie des effets.</p>`;
  const mx=voieHas('vp4')?2:1,pct=voieHas('vp4')?50:30,it=((meta.bast.items||[])[l])||[],own=Object.keys(RELICS).filter(r=>meta.relics[r]);
  return`<div class="lbl">Reliques de bastion · ${pct} % des effets aux unités</div>`+Array.from({length:mx},(_,i)=>`<div class="chips">${own.length?own.map(r=>`<button class="chip" data-bitem="${l}:${i}:${r}" aria-pressed="${it[i]===r}">${RELICS[r].name} ${relicLv(r)}</button>`).join(''):'<span class="muted">Aucune relique possédée.</span>'}</div>`).join('');
}
function openPicker(l,i){
  const owned=LINE_IDS.filter(x=>meta.lines[x]&&meta.facs[LINES[x].fac]);
  $('modalBox').innerHTML=`<h3>Placer dans le bastion ${LANE_DE[l]}</h3><p class="muted">Emplacement ${i+1}. Choisis une créature de ta collection.</p>
    <div class="list" style="max-height:55vh;overflow:auto">${owned.map(x=>{const f=meta.lines[x].form,L=LINES[x];return`<button class="card r${L.rar}" data-pick="${x}" style="text-align:left"><canvas data-look="line:${x}:${f}"></canvas><div class="nm">${L.forms[f][0]}<span class="pill rar">${RAR[L.rar].n}</span></div><div class="ds">${L.name} · ${L.role}${L.count>1?' · ×'+L.count:''}</div><span></span></button>`}).join('')}</div>
    <div class="cta"><button class="btn" id="mNo">Fermer</button></div>`;
  $('modal').hidden=false;paintAll($('modalBox'));$('mNo').onclick=closeModal;
  $('modalBox').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{meta.bast.load[l]=meta.bast.load[l]||[];meta.bast.load[l][i]=b.dataset.pick;saveMeta();closeModal();renderMeta()});
}
const shopSeed=()=>{const d=today();let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;return h};
function dailyOffers(){
  let sd=shopSeed();const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const pool=LINE_IDS.filter(l=>meta.facs[LINES[l].fac]&&lineOpen(l));const out=[];
  for(let k=0;k<3&&pool.length;k++){const l=pool.splice(Math.floor(R()*pool.length),1)[0],L=LINES[l];out.push({id:'o'+k,line:l,n:[8,5,3,2][L.rar],price:[140,180,220,260][L.rar]})}
  return out;
}
function marketScreen(){
  if(!meta.shop||meta.shop.day!==today())meta.shop={day:today(),bought:[]};
  const offers=dailyOffers();
  return topbar('Marché')+`<div class="sect"><h3>Change</h3><div class="grid2">
    ${[[1,200],[5,900],[12,2000]].map(([n,p])=>`<div class="frame card"><canvas data-look="item:rubis"></canvas><div class="nm">${n} cristal${n>1?'x':''} d’invocation`.replace('cristalx','cristaux')+`</div><div class="ds">Pour acheter des emplacements de bastion</div><button class="buy" data-xch="${n}:${p}" ${meta.ecl>=p?'':'disabled'}>${fmt(p)}<small>éclats</small></button></div>`).join('')}</div></div>
    <div class="sect"><h3>Offres du jour</h3><p class="muted">Des cartes ciblées pour faire évoluer une lignée précise. Les offres changent chaque jour, une seule fois chacune.</p><div class="grid2">
    ${offers.length?offers.map(o=>{const L=LINES[o.line],f=meta.lines[o.line]?meta.lines[o.line].form:0,got=meta.shop.bought.includes(o.id);
      return`<div class="frame card r${L.rar}"><canvas data-look="line:${o.line}:${f}"></canvas><div class="nm">${L.name}<span class="pill rar">${RAR[L.rar].n}</span></div><div class="ds">+${o.n} cartes${meta.lines[o.line]?'':' · débloque la lignée'}</div><button class="buy" data-offer="${o.id}" ${got||meta.ecl<o.price?'disabled':''}>${got?'Acheté':fmt(o.price)}${got?'':'<small>éclats</small>'}</button></div>`}).join(''):'<div class="empty">Aucune offre.</div>'}</div></div>`;
}
function questsScreen(){
  const Q=questState();
  return topbar('Quêtes')+`<p class="lead">Objectifs du jour, remis à zéro chaque jour. Ils avancent à la fin de chaque bataille.</p><div class="list">${QUESTS.map(q=>{const v=Math.min(q.goal,Q.p[q.id]||0),done=Q.done[q.id],ok=v>=q.goal;
    const rw=[q.rw.cri?`${q.rw.cri} cristal${q.rw.cri>1?'x':''}`.replace('cristalx','cristaux'):'',q.rw.ecl?`${q.rw.ecl} éclats`:''].filter(Boolean).join(' + ');
    return`<div class="frame" style="padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center"><div><b>${q.n}</b><div class="muted">Récompense : ${rw}</div></div>
    <button class="btn ${ok&&!done?'main':''}" data-claim="${q.id}" ${ok&&!done?'':'disabled'} style="grid-row:1/3;grid-column:2;padding:9px 14px">${done?'Réclamée':'Réclamer'}</button>
    <div><div class="prog"><i style="width:${v/q.goal*100}%"></i></div><small class="muted">${v}/${q.goal}</small></div></div>`}).join('')}</div>`;
}
let lastEnd=null;
function endScreen(){
  const e=lastEnd;if(!e)return playScreen();
  return`<div class="hero-t"><span class="eyebrow">${e.vs}</span><h1 style="color:${e.win?'var(--gold)':'var(--foe)'}">${e.win?'Victoire':'Défaite'}</h1><p class="lead">${e.win?'Le Nexus adverse s’effondre.':e.reason||'Ton Nexus est tombé.'} Tu gagnes ${e.ecl} éclats${e.bonus?` (dont ${e.bonus} de première réussite)`:''}, ${e.cri||0} ${(e.cri||0)>1?'cristaux':'cristal'} d’invocation et ${e.pts} point${e.pts>1?'s':''} de talent.${e.tomes?` Tomes d’expérience : +${e.tomes}.`:''}${e.hxp?` ${e.hname} gagne ${e.hxp} points de maîtrise${e.hup?` et monte de ${e.hup} niveau${e.hup>1?'x':''}`:''}.`:''}${e.nxt?' '+e.nxt:''}${e.ups?` Niveau de commandant ${meta.alvl} atteint : +${e.ups} cristal et +${50*e.ups} éclats.`:''}</p></div>
    <div class="grid2">${e.stats.map(([a,b])=>`<div class="frame" style="padding:14px"><div class="muted">${a}</div><div style="font-size:20px;font-weight:800" class="num">${b}</div></div>`).join('')}</div>
    <div class="cta"><button class="btn main" data-launch="1">Rejouer</button><button class="btn" data-go="hub">Quartier général</button></div>`;
}

$('meta').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.start){meta=freshMeta(d.start);saveMeta();curScr='play';renderMeta();toast('Bienvenue, commandant');return}
  if(d.back){navBack();return}
  if(d.page){if(d.ptabset)sub['p_'+d.page]=d.ptabset;curScr=d.page;renderMeta();$('meta').scrollTop=0;return}
  if(d.ptab){const[pg,id]=d.ptab.split(':');sub['p_'+pg]=id;renderMeta();return}
  if(d.mclaim){const[t,id]=d.mclaim.split(':');let rw=null;
    if(t==='d'){const q=DAILY.find(x=>x.id===id),D=dState();if(q&&!D.done[id]&&(D.p[q.k]||0)>=q.goal){D.done[id]=1;rw=q.rw}}
    else if(t==='w'){const q=WEEKLY.find(x=>x.id===id),W=wState();if(q&&!W.done[id]&&(W.p[q.k]||0)>=q.goal){W.done[id]=1;rw=q.rw}}
    else{const a=ACH.find(x=>x.id===id),c=(meta.ach[id]||0);if(a&&c<3&&lifeVal(a.k)>=a.t[c]){meta.ach[id]=c+1;rw=a.rw[c]}}
    if(rw){giveRw(rw);saveMeta();toast('Reçu : '+rwTxt(rw));renderMeta()}return}
  if(d.profile){openProfile();return}
  if(d.restore){restoreBackup(d.restore);return}
  if(d.gift&&!isUnl('hud:gift')){tryUnlock('hud:gift','le cadeau du jour',()=>renderMeta());return}
  if(d.chest&&!isUnl('hud:chest')){tryUnlock('hud:chest','le coffre',()=>renderMeta());return}
  if(d.gift){const g=meta.gift||{last:'',n:0};const day=g.n%7;
    $('modalBox').innerHTML=`<h3>Cadeau du jour</h3><p class="muted">Reviens chaque jour : la 7e récompense est la plus grosse, puis le cycle recommence.</p><div class="gifts">${GIFTS.map((r,i)=>`<div class="gday ${i<day?'got':''} ${i===day&&giftReady()?'now':''}"><small>Jour ${i+1}</small><b>${rwTxt(r)}</b></div>`).join('')}</div><div class="cta">${giftReady()?'<button class="btn main" id="gClaim">Récupérer</button>':`<span class="muted">Déjà récupéré aujourd’hui. Prochain cadeau demain.</span>`}<button class="btn" id="mNo">Fermer</button></div>`;
    $('modal').hidden=false;$('mNo').onclick=closeModal;if(giftReady())$('gClaim').onclick=()=>{const r=GIFTS[day];meta.gift={last:today(),n:g.n+1};giveRw(r);saveMeta();closeModal();toast('Cadeau : '+rwTxt(r));renderMeta()};return}
  if(d.chest){if(chestLeft()>0){toast('Coffre disponible dans '+fmtT(chestLeft()))}else openChest();return}
  if(d.unlock){const k=d.unlock;tryUnlock(k,d.label,()=>{if(k.startsWith('voie:')){meta.voie=k.slice(5);saveMeta();toast(VOIES.find(v=>v.id===meta.voie).name+' activée')}renderMeta()});return}
  if(d.go){if(d.go!=='hub'&&d.go!=='end'&&!canAccess(d.go)){toast('Débloque d’abord les écrans Deck et Boosters');return}
    if(d.go!=='hub'&&d.go!=='end'&&!isUnl('scr:'+d.go)){const S=SCREENS.find(s=>s.id===d.go);tryUnlock('scr:'+d.go,'l’écran '+S.name,()=>go(d.go));return}go(d.go);return}
  if(d.sub){sub[d.sub]=d.sub==='colEra'?+d.v:d.v;renderMeta();return}
  if(d.world){const i=+d.world;if(!worldOpen(i)){toast(`Gagne d’abord le monde ${i} en Normal`);return}sel.w=i;saveSel();renderMeta();return}
  if(d.car){const i=clamp(sel.w+ +d.car,0,WORLDS.length-1);sel.w=worldOpen(i)?i:sel.w;if(!worldOpen(i))toast(`Gagne d’abord le monde ${i} en Normal`);saveSel();renderMeta();return}
  if(d.dsel){sel.d=d.dsel;saveSel();renderMeta();return}
  if(d.mode){if(d.mode==='champ'&&!isUnl('mode:champ')){tryUnlock('mode:champ','le mode Champions 2 contre 2',()=>{sel.mode='champ';saveSel();renderMeta()});return}
    if(d.mode==='siege'&&!isUnl('mode:siege')){tryUnlock('mode:siege','le mode Siège',()=>{sel.mode='siege';saveSel();renderMeta()});return}sel.mode=d.mode;saveSel();renderMeta();return}
  if(d.hpick){sel.hero=d.hpick;saveSel();renderMeta();return}
  if(d.apick){sel.alliesSet=1;const a=sel.allies||[],i=a.indexOf(d.apick);if(i>=0)a.splice(i,1);else{if(a.length>=3){toast('3 alliés maximum : retire d’abord un héros');return}a.push(d.apick)}sel.allies=a;saveSel();renderMeta();return}
  if(d.hero){heroModal(d.hero);return}
  if(d.relup){const r=d.relup,c=relicCost(r);if(c&&meta.ecl>=c.ecl&&(meta.relicSh[r]||0)>=c.sh){meta.ecl-=c.ecl;meta.relicSh[r]-=c.sh;meta.relicLv[r]=relicLv(r)+1;bump('upgrades');saveMeta();toast(`${RELICS[r].name} niveau ${relicLv(r)}`);renderMeta()}return}
  if(d.chsel){sel.ch=d.chsel;saveSel();renderMeta();return}
  if(d.facbuy){buyFaction(d.facbuy);return}
  if(d.launch){launch();return}
  if(d.banner){if(!meta.facs[d.banner])return;meta.deck.banner=d.banner;saveMeta();renderMeta();return}
  if(d.deckline){const a=meta.deck.lines,i=a.indexOf(d.deckline);if(i>=0)a.splice(i,1);else if(a.length<6)a.push(d.deckline);saveMeta();renderMeta();return}
  if(d.deckhero){const a=meta.deck.heroes,i=a.indexOf(d.deckhero),mx=hasNode('h5')?3:2;if(i>=0)a.splice(i,1);else if(a.length<mx)a.push(d.deckhero);saveMeta();renderMeta();return}
  if(d.evolve){const o=meta.lines[d.evolve],need=EVO_CARDS[o.form],ec=EVO_ECL[o.form];if(o.cards>=need&&meta.ecl>=ec){o.cards-=need;meta.ecl-=ec;o.form++;bump('upgrades');saveMeta();toast(`Évolution : ${LINES[d.evolve].forms[o.form][0]}`);renderMeta()}return}
  if(d.herolvl){const o=meta.heroes[d.herolvl],need=[1,2,4,8][o.lvl-1],ec=[100,200,350,550][o.lvl-1];if(o.cards>=need&&meta.ecl>=ec){o.cards-=need;meta.ecl-=ec;o.lvl++;bump('upgrades');saveMeta();renderMeta()}return}
  if(d.relic){const cur=meta.relicOn[d.h];for(const k in meta.relicOn)if(meta.relicOn[k]===d.relic)delete meta.relicOn[k];if(cur!==d.relic){meta.relicOn[d.h]=d.relic;unBast(d.relic)}saveMeta();renderMeta();return}
  if(d.bitem){const[l,i,r]=d.bitem.split(':');const B=meta.bast;B.items=B.items||[[],[],[]];const it=B.items[+l]=B.items[+l]||[];if(it[+i]===r)it[+i]=null;else{unBast(r);for(const k in meta.relicOn)if(meta.relicOn[k]===r)delete meta.relicOn[k];it[+i]=r}saveMeta();renderMeta();return}
  if(d.tier){const c=TIER_COST[meta.tiers[d.tier]];if(meta.ecl>=c){meta.ecl-=c;meta.tiers[d.tier]++;bump('upgrades');saveMeta();toast(TIERS[d.tier].names[meta.tiers[d.tier]-1]);renderMeta()}return}
  if(d.node){const c=+d.c;if(meta.pts>=c){meta.pts-=c;meta.nodes[d.node]=true;bump('upgrades');saveMeta();renderMeta()}return}
  if(d.voie){const first=!meta.voie;if(!first&&meta.ecl<VOIE_SWITCH)return;if(!first)meta.ecl-=VOIE_SWITCH;meta.voie=d.voie;saveMeta();toast(VOIES.find(v=>v.id===d.voie).name+' activée');renderMeta();return}
  if(d.talreset){let r=0;for(const tr of [...TREES,...VOIES])for(const n of tr.nodes)if(meta.nodes[n.id])r+=n.cost;meta.pts+=r;meta.nodes={};saveMeta();renderMeta();return}
  if(d.pack){openPack(d.pack);return}
  if(d.pickslot){const[l,i]=d.pickslot.split(':').map(Number);openPicker(l,i);return}
  if(d.clearslot){const[l,i]=d.clearslot.split(':').map(Number);meta.bast.load[l][i]=null;saveMeta();renderMeta();return}
  if(d.copyslot){const l=+d.copyslot;for(let k=0;k<3;k++)if(k!==l)meta.bast.load[k]=(meta.bast.load[l]||[]).slice(0,meta.bast.slots[k]);saveMeta();toast('Placement copié (dans la limite des emplacements de chaque bastion)');renderMeta();return}
  if(d.slotbuy){const l=+d.slotbuy,c=slotCost(l),e=slotEcl(l);const ok=()=>{meta.bast.slots[l]++;bump('upgrades');saveMeta();closeModal();toast('Nouvel emplacement débloqué');renderMeta()};
    $('modalBox').innerHTML=`<h3>Emplacement ${meta.bast.slots[l]+1} · bastion ${LANE_DE[l]}</h3><p class="muted">Deux façons de payer, au choix.</p>
    <div class="list"><button class="card" id="sCri" ${meta.cri>=c?'':'disabled'} style="text-align:left"><canvas data-look="item:rubis"></canvas><div class="nm">${c} cristaux d’invocation</div><div class="ds">Tu en possèdes ${meta.cri}${meta.cri<c?' : pas assez':''}.</div><span class="buy" style="grid-row:1/3;color:#d6b8ff">${c}</span></button>
    <button class="card" id="sEcl" ${meta.ecl>=e?'':'disabled'} style="text-align:left"><canvas data-look="item:fleau"></canvas><div class="nm">${fmt(e)} éclats</div><div class="ds">Beaucoup plus cher en éclats. Tu en possèdes ${fmt(meta.ecl)}${meta.ecl<e?' : pas assez':''}.</div><span class="buy" style="grid-row:1/3">${fmt(e)}</span></button></div>
    <div class="cta"><button class="btn" id="mNo">Annuler</button></div>`;
    $('modal').hidden=false;paintAll($('modalBox'));$('mNo').onclick=closeModal;
    $('sCri').onclick=()=>{if(meta.cri<c)return;meta.cri-=c;ok()};$('sEcl').onclick=()=>{if(meta.ecl<e)return;meta.ecl-=e;ok()};return}
  if(d.xch){const[n,p]=d.xch.split(':').map(Number);if(meta.ecl>=p){meta.ecl-=p;meta.cri+=n;saveMeta();toast(`+${n} cristaux`);renderMeta()}return}
  if(d.offer){const o=dailyOffers().find(x=>x.id===d.offer);if(o&&meta.ecl>=o.price&&!meta.shop.bought.includes(o.id)){meta.ecl-=o.price;meta.shop.bought.push(o.id);if(!meta.lines[o.line])meta.lines[o.line]={form:0,cards:o.n-1};else meta.lines[o.line].cards+=o.n;saveMeta();toast(`+${o.n} cartes ${LINES[o.line].name}`);renderMeta()}return}
  if(d.claim){const q=QUESTS.find(x=>x.id===d.claim),Q=questState();if(q&&!Q.done[q.id]&&(Q.p[q.id]||0)>=q.goal){Q.done[q.id]=1;meta.cri+=q.rw.cri||0;meta.ecl+=q.rw.ecl||0;saveMeta();toast('Récompense reçue');renderMeta()}return}
  if(d.test){meta.ecl+=2000;meta.pts+=10;meta.cri+=30;meta.tomes=(meta.tomes||0)+20;meta.grim=(meta.grim||0)+3;meta.alvl=(meta.alvl||1)+5;bump('minions',400);bump('wins',3);saveMeta();toast('+2 000 éclats, +30 cristaux, +10 talents, +20 tomes, +3 grimoires, +5 niveaux de commandant');renderMeta();return}
  if(d.reset){resetGame();return}
});

/* ---------- boosters ---------- */
function weighted(pool,w){let s=Math.random()*w.reduce((a,b)=>a+b,0);for(let j=0;j<pool.length;j++){s-=w[j];if(s<=0)return pool[j]}return pool[pool.length-1]}
function openPack(id,free){
  const cost=free?0:id==='royal'?220:120;if(meta.ecl<cost){toast('Pas assez d’éclats');return}
  meta.ecl-=cost;bump('boosters');const cards=[];
  for(let i=0;i<5;i++){const fac=id==='royal'?pick(FAC_IDS):id,r=Math.random();
    if(r<.1){const n=1+(Math.random()<.35?1:0)+(id==='royal'?1:0);meta.tomes=(meta.tomes||0)+n;cards.push({kind:'tome',n,rar:0});continue}
    if(r<.115){meta.grim=(meta.grim||0)+1;cards.push({kind:'grim',n:1,rar:2});continue}
    if(r<(id==='royal'?.25:.2)){const pool=HERO_IDS.filter(h=>HEROES[h].fac===fac&&heroOpen(h)),hid=weighted(pool,pool.map(h=>[6,6,3,1.2][HEROES[h].rar]));
      const isNew=!meta.heroes[hid];if(isNew)meta.heroes[hid]={lvl:1,cards:0};else meta.heroes[hid].cards++;cards.push({kind:'hero',id:hid,isNew,rar:HEROES[hid].rar})}
    else if(r<(id==='royal'?.33:.27)){const rid=pick(Object.keys(RELICS).filter(k=>RELICS[k].fac===fac));const isNew=!meta.relics[rid];if(isNew)meta.relics[rid]=true;else meta.relicSh[rid]=(meta.relicSh[rid]||0)+1;cards.push({kind:'relic',id:rid,isNew,rar:RELICS[rid].rar})}
    else{const pool=availLines(fac),lid=weighted(pool,pool.map(l=>[5,3,1.6,.7][LINES[l].rar]*(id==='royal'&&LINES[l].rar>0?1.6:1)));
      const L=LINES[lid],n=L.rar===0?3+Math.floor(Math.random()*3):L.rar===1?2+Math.floor(Math.random()*2):L.rar===2?1+Math.floor(Math.random()*2):1;
      const isNew=!meta.lines[lid];if(isNew)meta.lines[lid]={form:0,cards:n-1};else meta.lines[lid].cards+=n;cards.push({kind:'line',id:lid,n,isNew,rar:L.rar})}}
  saveMeta();
  const box=$('openBox'),P0=PACKS().find(p=>p.id===id);
  box.innerHTML=`<span class="eyebrow">Ouverture</span><h2 style="font-size:30px;color:${P0.col}">${P0.name[0].toUpperCase()+P0.name.slice(1)}</h2><div class="cards">${cards.map(c=>{
    let name,subt,key;if(c.kind==='line'){name=LINES[c.id].name;subt=c.isNew?'Nouvelle lignée !':`+${c.n} cartes`;key=`line:${c.id}:${meta.lines[c.id].form}`}
    else if(c.kind==='hero'){name=HEROES[c.id].name;subt=c.isNew?'Nouveau héros !':'+1 carte de héros';key=`look:${HEROES[c.id].look}`}
    else if(c.kind==='tome'){name='Tome d’expérience';subt=`+${c.n} tome${c.n>1?'s':''} · fait monter la maîtrise d’un héros`;key='item:tome'}
    else if(c.kind==='grim'){name='Grimoire';subt='+1 point de compétence pour le héros de ton choix';key='item:grim'}
    else{name=RELICS[c.id].name;subt=c.isNew?'Nouvelle relique !':'Doublon · +1 fragment pour l’améliorer';key=`item:${RELIC_ICON[c.id]}`}
    return`<div class="tcg r${c.rar}"><div class="in"><div class="ba"></div><div class="fa"><canvas data-look="${key}"></canvas><b>${name}</b><small>${RAR[c.rar].n} · ${{line:'Lignée',hero:'Héros',relic:'Relique',tome:'Tome',grim:'Grimoire'}[c.kind]}</small>${c.isNew?'<span class="badge">Nouveau</span>':c.kind==='line'||c.kind==='tome'?`<span class="badge">+${c.n}</span>`:''}<small>${subt}</small></div></div></div>`}).join('')}</div>
    <div class="cta"><button class="btn" id="flipAll">Tout retourner</button><button class="btn main" id="closeOpen">Continuer</button></div>`;
  $('opening').hidden=false;paintAll(box);
  const els=[...box.querySelectorAll('.tcg')];els.forEach((el,i)=>{el.addEventListener('click',()=>el.classList.add('open'));setTimeout(()=>el.classList.add('open'),500+i*380)});
  $('flipAll').onclick=()=>els.forEach(el=>el.classList.add('open'));
  $('closeOpen').onclick=()=>{$('opening').hidden=true;renderMeta()};
}

/* ---------- modale & toast ---------- */
let modalYes=null;
function confirmBox(title,text,yes,onYes){modalYes=onYes;$('modalBox').innerHTML=`<h3>${title}</h3><p class="muted">${text}</p><div class="cta">${yes?`<button class="btn main" id="mYes">${yes}</button>`:''}<button class="btn" id="mNo">${yes?'Annuler':'Fermer'}</button></div>`;
  $('modal').hidden=false;if(yes)$('mYes').onclick=()=>{closeModal();modalYes&&modalYes()};$('mNo').onclick=closeModal}
function closeModal(){$('modal').hidden=true;$('modalBox').onclick=null}
let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- lancement et fin ---------- */
function champReady(){const mk=sel.mode==='siege'?'mode:siege':'mode:champ';if(!isUnl(mk))return'Débloque d’abord ce mode de jeu';if(!isUnl('scr:heroes'))return'Débloque d’abord l’invocation des héros (Armée › Héros)';
  if(!sel.hero||!heroPlayable(sel.hero)){const h=HERO_IDS.find(heroPlayable);if(!h)return'Il te faut au moins un héros jouable';sel.hero=h}return''}
function launch(){
  const champ=sel.mode==='champ'||sel.mode==='siege',siege=sel.mode==='siege';
  if(champ){const r=champReady();if(r){toast(r);return}}else if(!meta.deck.lines.length){toast('Ton deck est vide');return}
  if(!worldOpen(sel.w))sel.w=0;const W=WORLDS[sel.w];if(sel.d==='defi'&&!W.ch.includes(sel.ch))sel.ch=W.ch[0];
  const enemy=W.fac,diff=champ&&sel.d==='defi'?'normal':sel.d;
  newGame(sel.w,diff,sel.ch,siege?'siege':champ?'champ':'camp',sel.hero);$('foeName').textContent=siege?'Portails · '+FACTIONS[enemy].name:FACTIONS[enemy].name;$('feed').innerHTML='';
  $('meta').hidden=true;$('menuBg').hidden=true;$('game').hidden=false;$('game').classList.toggle('champ',champ);
  VIEW=VIEWS[siege?2:0];placeBuildings();closeBld();$('gmenu').hidden=true;fitCanvas();battleScreen();$('viewBtn').innerHTML=`Vue : ${VIEW.name} <kbd class="h">V</kbd>`;
  if(champ){const p=P(G.me.x,G.me.y);cam.z=3.1;cam.x=p.x;cam.y=p.y;G.follow=true}else if(true){const p=P(BASE[0].x,BASE[0].y);cam.z=CW<560?2:1.8;cam.x=p.x+80;cam.y=p.y-80}else{cam.z=1;cam.x=500;cam.y=500}
  clampCam();$('followBtn').setAttribute('aria-pressed',!!G.follow);
  G.tab=champ?'champ':'bastions';speed=1;setSpeedUI();closePop();renderTab();buildSkbar();
  if(siege){log(`Siège · ${FACTIONS[enemy].name} · ${DIFF[diff].name}`,'g');log(`Toi : ${G.me.name}. Tes alliés : ${G.teams[0].heroes.filter(h=>!h.manual).map(h=>h.name).join(' et ')||'aucun'}.`,'a');
    log('Ta citadelle est au centre. Les monstres arrivent des 4 portails. Touche un de tes autres héros pour le contrôler à son tour.','a');
    log(TOUCH?'Déplace ton héros avec le pad en bas à gauche. Touche un ennemi pour l’attaquer.':'Clic droit pour te déplacer ou attaquer. Clic gauche glissé : caméra.','a');return}
  if(champ){log(`Champions 2 contre 2 · ${W.name} · ${DIFF[diff].name}`,'g');log(`Toi : ${G.me.name}. Allié : ${G.teams[0].heroes.find(h=>!h.manual).name}. En face : ${G.teams[1].heroes.map(h=>h.name).join(' et ')}.`,'a');log('Arène des Champions : chaque camp défend son propre côté, séparé par la rivière. Ta voie est en bas : seuls tes monstres envoyés passent chez l’adversaire.','a');log(TOUCH?'Déplace ton héros avec le pad en bas à gauche, ou touche le sol. Touche un ennemi pour l’attaquer.':'Clic droit pour te déplacer ou attaquer (garde-le enfoncé : ton héros suit la souris). Clic gauche glissé : déplacer la caméra.','a');log('Envoie des monstres depuis l’onglet Envoyer : chaque envoi augmente ton revenu.','a');return}
  log(`${W.name} · ${DIFF[sel.d].name}. Première vague dans 6 s.`,'g');
  if(G.ch)log('Défi : '+CHALL[G.ch].n,'v');
  log('Ajoute des monstres à tes bastions : ils sortiront à chaque vague.','a');
}
function endGame(win,quit,reason){
  if(G.over)return;G.over=true;const T=G.teams[0],E=G.teams[1],D=DIFF[G.diff],W=G.world;
  let ecl=Math.round(((win?300:120)*(1+.15*G.wi)+15*T.towers+Math.floor(T.kills/10))*D.ecl*(quit?.5:1)),pts=win?(G.diff==='hard'||G.diff==='defi'?4:3):1,bonus=0;
  const champ=G.mode==='champ';
  if(win){const book=champ?(meta.cprog=meta.cprog||{}):meta.prog;const p=book[W.id]=book[W.id]||{};const key=G.ch?'ch_'+G.ch:G.diff;if(!p[key]){bonus=firstBonus(G.diff);p[key]=1}if(G.diff==='defi')p.normal=p.normal||0}
  ecl+=bonus;const cri=quit?0:(win?2+(G.diff==='hard'||G.diff==='defi'?1:0)+(bonus?3:0):1);
  const tomes=quit?0:champ?(win?3:1):(win?1:0);let hxp=0,hup=0;if(champ&&!quit&&G.me){hxp=win?260:100;hup=addHeroXp(G.meId,hxp)}
  meta.ecl+=ecl;meta.cri+=cri;meta.pts+=pts;meta.tomes=(meta.tomes||0)+tomes;meta.stats[win?'w':'l']++;
  bump('games');if(win)bump('wins');if(win&&G.ch)bump('defis');bump('fus',G.fus);for(const k in G.st)bump(k,G.st[k]);
  const ups=gainAcc(quit?10:win?100:40);
  saveMeta();
  const s=Math.floor(G.t),nxt=win&&G.diff==='normal'&&WORLDS[G.wi+1]&&bonus?`Monde ${G.wi+2} débloqué : ${WORLDS[G.wi+1].name}.`:'';
  const st0=[['Durée',Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')],['Or gagné',fmt(T.earned)+' (adv. '+fmt(E.earned)+')'],['Ennemis tués',T.kills+' (adv. '+E.kills+')'],['Structures détruites',T.towers+' (adv. '+E.towers+')']];
  if(champ&&G.me)st0.push(['Ton champion',`${G.me.name} · niv. ${G.me.lvl} en partie`],['Héros abattus',String(G.st.heroes)]);
  lastEnd={win,ecl,pts,cri,reason,ups,bonus,nxt:champ?'':nxt,tomes,hxp,hup,hname:champ&&G.me?G.me.name:'',vs:`${G.siege?'Siège · ':champ?'Champions 2 contre 2 · ':''}${W.name} · ${D.name}${G.ch?' · '+CHALL[G.ch].n:''}`,stats:st0};
  setTimeout(()=>{$('game').hidden=true;$('meta').hidden=false;$('menuBg').hidden=false;go('end')},quit?50:1600);
}

/* ---------- fond animé du menu ---------- */
let lastPaint=0;
function menuFrame(ts){
  const bg=$('menuBg');if(bg.hidden)return;const t=ts/1000,W=innerWidth,H=innerHeight,d=Math.min(2,devicePixelRatio||1);
  if(bg.width!==Math.round(W*d)){bg.width=Math.round(W*d);bg.height=Math.round(H*d)}const c=bg.getContext('2d'),m=getMap(VIEWS[1]);
  const s=Math.max(W/m.width,H/m.height)*1.25;c.setTransform(d,0,0,d,0,0);c.drawImage(m,(W-m.width*s)/2+Math.sin(t*.05)*40,(H-m.height*s)/2+Math.cos(t*.04)*30,m.width*s,m.height*s);
  if(ts-lastPaint<90||!$('opening').hidden)return;lastPaint=ts;
  const ct=$('chestT');if(ct&&meta&&meta.start){const l=chestLeft();ct.textContent=l?fmtT(l):'Coffre prêt'}
  $('meta').querySelectorAll('.wcard canvas[data-look],.pack canvas[data-look],.facc canvas[data-look]').forEach(cn=>{const r=cn.getBoundingClientRect();if(r.bottom>0&&r.top<H)paintKey(cn,cn.dataset.look,t*3)});
}

function toggleFS(){
  const d=document,el=d.documentElement,on=d.fullscreenElement||d.webkitFullscreenElement;
  try{if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!rq)throw 0;const r=rq.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>toast('Plein écran indisponible ici : ouvre le jeu dans un navigateur, ou tourne ton téléphone à l’horizontale.'))}}
  catch(e){toast('Plein écran indisponible ici : ouvre le jeu dans un navigateur, ou tourne ton téléphone à l’horizontale.')}
}
function fsLabels(){const on=!!(document.fullscreenElement||document.webkitFullscreenElement);document.querySelectorAll('.fsb').forEach(b=>{b.innerHTML=b.classList.contains('cur')?`⛶ <small>${on?'Quitter le plein écran':'Plein écran'}</small>`:`⛶ ${on?'Quitter':'Plein écran'} <kbd class="h">Maj+F</kbd>`})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fs]');if(b){e.stopPropagation();toggleFS()}},true);
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{fsLabels();if(!$('game').hidden)setTimeout(fitCanvas,60)}));
document.addEventListener('keydown',e=>{if(e.code==='KeyF'&&e.shiftKey){e.preventDefault();e.stopImmediatePropagation();toggleFS()}},true);
renderMeta();requestAnimationFrame(loop);
</script>
